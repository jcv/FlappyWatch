name: FlappyWatch
options:
  bundleIdPrefix: com.oyoroi.flappywatch
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  FlappyWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FlappyWatch Watch App
    info:
      path: FlappyWatch Watch App/Info.plist
      properties:
        CFBundleDisplayName: FlappyWatch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oyoroi.flappywatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
